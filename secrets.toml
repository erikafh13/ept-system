# .streamlit/secrets.toml
# ⚠️  JANGAN upload file ini ke GitHub! Sudah ada di .gitignore.
# Salin file ini, isi dengan kredensial asli, lalu simpan.

[spreadsheet]
id = "MASUKKAN_ID_GOOGLE_SPREADSHEET_KAMU_DISINI"

[gcp_service_account]
type = "service_account"
project_id = "NAMA_PROJECT_GCP"
private_key_id = "PRIVATE_KEY_ID"
private_key = """-----BEGIN RSA PRIVATE KEY-----
PRIVATE_KEY_KAMU_DISINI
-----END RSA PRIVATE KEY-----"""
client_email = "nama-service-account@project.iam.gserviceaccount.com"
client_id = "CLIENT_ID"
auth_uri = "https://accounts.google.com/o/oauth2/auth"
token_uri = "https://oauth2.googleapis.com/token"
auth_provider_x509_cert_url = "https://www.googleapis.com/oauth2/v1/certs"
client_x509_cert_url = "https://www.googleapis.com/robot/v1/metadata/x509/nama-service-account%40project.iam.gserviceaccount.com"
